# ─────────────────────────────────────────────────────────
#  API Sentinel — docker compose
#
#  Quick start:
#    cp .env.example .env   # optionally fill in GROQ_API_KEY
#    docker compose up --build
#
#  Access:
#    Frontend  →  http://localhost:3000
#    Backend   →  http://localhost:8000
#    API docs  →  http://localhost:8000/docs
# ─────────────────────────────────────────────────────────

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ── Auth ───────────────────────────────────────────
      # Leave both blank for dev mode (no sign-in required).
      # SENTINEL_API_KEY: shared key checked in dev mode (Authorization: ApiKey <key>)
      - SENTINEL_API_KEY=${SENTINEL_API_KEY:-}
      # Firebase service-account JSON on ONE line (wrap it in single quotes
      # in .env). When set, every request needs a Firebase ID token.
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON:-}

      # ── LLM Configuration ──────────────────────────────
      # "groq" = cloud (fast, free tier available)
      # "ollama" = local (no API key needed, slower)
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}

      # Groq — get a free key at https://console.groq.com
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Model names are overridable — list what your key can use with
      # GET https://api.groq.com/openai/v1/models
      - GROQ_MODEL_PRIMARY=${GROQ_MODEL_PRIMARY:-openai/gpt-oss-120b}
      - GROQ_MODEL_FALLBACK=${GROQ_MODEL_FALLBACK:-openai/gpt-oss-20b}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.2}

      # Gemini — used when Groq fails (or LLM_PROVIDER=gemini)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}

      # Seconds before a Groq/Gemini call is abandoned
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-45}

      # Ollama — only needed if LLM_PROVIDER=ollama. Inside the container
      # "localhost" is the container itself; reach Ollama on the host instead.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-llama3.1:8b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-60}

      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}

      # DB path inside the container (persisted via volume)
      - SENTINEL_DB_PATH=/data/sentinel.db

    volumes:
      - sentinel_data:/data

    # Makes host.docker.internal resolve on Linux too (built in on Docker Desktop)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # python:3.11-slim has no curl — use the interpreter that's already there.
    # urlopen raises on connection errors and non-2xx, giving a non-zero exit.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 5s   # probe often while starting (Docker Engine 25+)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    container_name: sentinel_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sentinel_data:
    driver: local